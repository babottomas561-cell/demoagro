version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  # Se mantienen nombres legacy por compatibilidad local.
  db:
    image: postgres:16-alpine
    container_name: demoagro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demoagro}
      POSTGRES_USER: ${POSTGRES_USER:-agro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agro_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro_user} -d ${POSTGRES_DB:-demoagro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache APIs externas) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: demoagro_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend FastAPI / Lemon BI ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demoagro_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agro_user}:${POSTGRES_PASSWORD:-agro_pass}@db:5432/${POSTGRES_DB:-demoagro}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        python -m app.seed.run_seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ─── Frontend Next.js / Lemon BI ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: demoagro_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

networks:
  default:
    name: demoagro_network
